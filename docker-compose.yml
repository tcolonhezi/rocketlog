services:
  postgres:
    image: "bitnami/postgresql:latest"
    container_name: "postgres_log"
    environment:
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=postgresql
      - POSTGRESQL_DATABASE=rocketlog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/bitnami/postgresql

volumes:
  postgres_data:
